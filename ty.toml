[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests", "./tools/moe-predictor"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
import-not-found = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"

[[overrides]]
include = [
    "./tools/moe-predictor/**",
]

# torch declares nn.Module.forward as a Callable attribute, so every forward() method reads as an override of a mutable attribute
[overrides.rules]
incompatible-mutable-override = "ignore"
